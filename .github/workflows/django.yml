name: MediVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Libraries (Cairo, Pango for ReportLab & PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-dejavu-core

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Migrations (No Unstaged Changes)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-dummy-secret-key-for-automated-testing-1234
          DATABASE_URL: sqlite:///tmp/ci_test.sqlite3
          MESSAGING_BACKEND: email
          PYTHONPATH: .
        run: |
          python manage.py makemigrations --check

      - name: Run Pytest Test Suite
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-dummy-secret-key-for-automated-testing-1234
          DATABASE_URL: sqlite:///tmp/ci_test.sqlite3
          MESSAGING_BACKEND: email
          PYTHONPATH: .
        run: |
          pytest -c pytest.ini tests/ -v --create-db

  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile Vite Production Bundle
        working-directory: frontend
        run: npm run build
